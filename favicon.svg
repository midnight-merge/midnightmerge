<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <clipPath id="c"><rect width="32" height="32" rx="7"/></clipPath>
  </defs>
  <rect width="32" height="32" rx="7" fill="#0a0b0e"/>
  <g clip-path="url(#c)">
    <g fill="none" stroke="#e2a044" stroke-width="2.8" stroke-linecap="butt">
      <!-- trunk: straight down out of the dot, off the bottom edge -->
      <path d="M16 16V32"/>
